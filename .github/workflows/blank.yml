# This is a basic workflow to help you get started with Actions

name: CI

on:
  issues:
    types:
      - opened
  workflow_dispatch: 
      
permissions:
  contents: write
  issues: write

jobs:
  comment:

    runs-on: ubuntu-latest

    steps:
      - name: Debug - Check repo access
        run: |
          echo "Testing API access..."
          gh api repos/moliii-illo/codespaces --jq '.name, .private' || echo "Repo not accessible"
          echo "Listing repo contents..."
          gh api repos/moliii-illo/codespaces/contents || echo "Cannot list contents"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

